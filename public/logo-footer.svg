<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 180" width="720" height="180" fill="none">
  <defs>
    <linearGradient id="logoBlueGradWhiteFooter" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="50%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <filter id="softShadowWhiteFooter" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Blue Rounded Box with Crisp Checkmark -->
  <g filter="url(#softShadowWhiteFooter)">
    <rect x="20" y="20" width="140" height="140" rx="36" fill="url(#logoBlueGradWhiteFooter)"/>
    <rect x="21" y="21" width="138" height="138" rx="35" stroke="white" stroke-opacity="0.35" stroke-width="2.5"/>
    <path d="M52 92 L78 118 L126 62" stroke="#FFFFFF" stroke-width="17" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Typography: All White with Vibrant Green Accent -->
  <text x="195" y="96" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="52" font-weight="900" letter-spacing="-1.5">
    <tspan fill="#FFFFFF">Plataforma </tspan>
    <tspan fill="#22C55E">Eu </tspan>
    <tspan fill="#FFFFFF">Voto</tspan>
  </text>

  <!-- Subtitle: Crisp Off-White -->
  <text x="200" y="142" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="33" font-weight="600" fill="#F1F5F9" letter-spacing="-0.5">
    Seu Voto, Sua Voz
  </text>
</svg>
